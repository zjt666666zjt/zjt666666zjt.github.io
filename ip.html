<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NET SIGHT - 全维 IP 情报</title>
<style>
    :root {
        --bg-color: #020617;
        --panel-bg: rgba(15, 23, 42, 0.6);
        --panel-border: rgba(56, 189, 248, 0.2);
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --accent-color: #06b6d4; /* Cyan */
        --accent-glow: rgba(6, 182, 212, 0.3);
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --danger-color: #ef4444;
        --terminal-bg: #0c0c0c;
        --terminal-text: #4af626;
        --map-height: 280px;
    }

    body {
        background-color: var(--bg-color);
        background-image: 
            radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 25%),
            radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.08), transparent 25%);
        color: var(--text-primary);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .container {
        width: 100%;
        max-width: 1000px; /* 加宽以容纳更多信息 */
        animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .panel {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 
                    0 20px 50px -10px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        position: relative;
    }

    /* 顶部光效线条 */
    .panel::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        opacity: 0.5;
    }

    /* --- Header Area --- */
    .header {
        padding: 30px 40px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        background: rgba(0,0,0,0.2);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .logo-icon {
        width: 32px;
        height: 32px;
        color: var(--accent-color);
        filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .brand-text {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .live-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--accent-color);
        background: rgba(6, 182, 212, 0.1);
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .blink {
        width: 6px;
        height: 6px;
        background: var(--accent-color);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-color);
        animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* --- Main Info & Map Section --- */
    .hero-section {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    @media (max-width: 768px) {
        .hero-section { grid-template-columns: 1fr; }
    }

    .ip-overview {
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .flag-large {
        font-size: 48px;
        margin-bottom: 10px;
        display: inline-block;
    }

    .ip-display {
        font-family: 'Monaco', monospace;
        font-size: 36px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 8px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .location-text {
        font-size: 18px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* 地图容器 */
    .map-box {
        height: var(--map-height);
        background: #0f172a;
        position: relative;
        overflow: hidden;
        border-left: 1px solid rgba(255,255,255,0.05);
    }
    
    @media (max-width: 768px) {
        .map-box { border-left: none; border-top: 1px solid rgba(255,255,255,0.05); }
    }

    .map-frame {
        width: 100%;
        height: 100%;
        border: none;
        filter: grayscale(100%) invert(90%) contrast(85%); /* 深色地图风格滤镜 */
        opacity: 0.8;
        transition: opacity 0.3s;
    }
    .map-frame:hover { opacity: 1; filter: grayscale(0%) invert(0%); }

    .map-overlay {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background: rgba(0,0,0,0.7);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 10px;
        pointer-events: none;
        color: #fff;
    }

    /* --- Content Grid --- */
    .grid-layout {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        padding: 30px 40px;
    }

    .card {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 16px;
        padding: 20px;
        transition: transform 0.2s, background 0.2s;
        display: flex;
        flex-direction: column;
    }

    .card:hover {
        background: rgba(255,255,255,0.04);
        transform: translateY(-2px);
    }

    .card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        color: var(--accent-color);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .info-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 13px;
        border-bottom: 1px dashed rgba(255,255,255,0.05);
        padding-bottom: 4px;
    }
    .info-item:last-child { border-bottom: none; margin-bottom: 0; }

    .label { color: var(--text-secondary); }
    .val { color: var(--text-primary); font-weight: 500; text-align: right; word-break: break-all; max-width: 60%; }
    .val.highlight { color: var(--accent-color); }
    .val.mono { font-family: 'Monaco', monospace; font-size: 12px; }

    /* Tags */
    .tags-container {
        padding: 0 40px 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-secondary);
        transition: all 0.3s;
    }

    .tag.active {
        background: rgba(6, 182, 212, 0.1);
        border-color: rgba(6, 182, 212, 0.3);
        color: var(--accent-color);
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.1);
    }

    .tag.danger {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: var(--danger-color);
    }

    /* Terminal Section */
    .terminal-section {
        margin: 0 40px 40px 40px;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 30px;
    }
    
    .terminal-header {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .terminal-box {
        background: var(--terminal-bg);
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        font-family: 'Monaco', 'Consolas', monospace;
        font-size: 12px;
        line-height: 1.5;
        color: var(--terminal-text);
        max-height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    /* Loading */
    .loading-view {
        padding: 100px;
        text-align: center;
        color: var(--text-secondary);
    }
    .loader {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255,255,255,0.1);
        border-radius: 50%;
        border-top-color: var(--accent-color);
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

</style>
</head>
<body>

<div class="container">
    <div class="panel" id="panel">
        <div class="loading-view">
            <div class="loader"></div>
            <div>INITIALIZING GLOBAL NETWORK SCAN...</div>
        </div>
    </div>
</div>

<script>
async function loadIP() {
    const panel = document.getElementById('panel');
    const API_KEY = "bc457a7850f88f5d0423";

    try {
        // 并行请求：主 JSON 数据
        const mainReq = fetch(`https://api.ipapi.is/?key=${API_KEY}`);
        
        // 我们先拿到 JSON，从中获取 IP，再请求 Whois
        // 为了最快响应，我们先 await JSON
        const mainRes = await mainReq;
        const d = await mainRes.json();

        if (d.error) {
            panel.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger-color)">❌ SYSTEM ERROR: ${d.error.message || JSON.stringify(d.error)}</div>`;
            return;
        }

        // 获取 Whois 数据 (Text 格式)
        let whoisText = "";
        try {
            const whoisRes = await fetch(`https://api.ipapi.is/?whois=${d.ip}&key=${API_KEY}`);
            if (whoisRes.ok) {
                whoisText = await whoisRes.text();
            } else {
                whoisText = `Failed to fetch Whois data: ${whoisRes.status}`;
            }
        } catch (err) {
            whoisText = `Whois connection error: ${err.message}`;
        }

        renderDashboard(d, whoisText);

    } catch (e) {
        console.error(e);
        panel.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger-color)">❌ CONNECTION FAILED</div>`;
    }
}

// 简单的 Whois 解析器
function parseWhois(text) {
    if (!text) return {};
    
    const extract = (regex) => {
        const match = text.match(regex);
        return match ? match[1].trim() : '-';
    };

    // 正则匹配常见字段 (适配 APNIC/RIPE 等格式)
    return {
        netname: extract(/netname:\s*(.+)/i),
        descr: extract(/descr:\s*(.+)/i),
        country: extract(/country:\s*(.+)/i),
        inetnum: extract(/(?:inetnum|NetRange):\s*(.+)/i),
        abuse: extract(/(?:abuse-mailbox|OrgAbuseEmail|e-mail):\s*(.+)/i),
        maintainedBy: extract(/mnt-by:\s*(.+)/i),
        lastModified: extract(/(?:last-modified|Updated):\s*(.+)/i)
    };
}

function renderDashboard(d, whoisText) {
    const panel = document.getElementById('panel');
    const flag = getFlag(d.location?.country_code);
    
    // 解析 Whois
    const whois = parseWhois(whoisText);

    // 经纬度
    const lat = d.location?.latitude || 0;
    const lon = d.location?.longitude || 0;
    const mapUrl = `https://maps.google.com/maps?q=${lat},${lon}&z=11&output=embed&iwloc=near`;

    // 状态标签
    const flags = [
        { key: 'is_datacenter', label: 'DATACENTER', icon: '🏢' },
        { key: 'is_proxy', label: 'PROXY', icon: '🛡️' },
        { key: 'is_vpn', label: 'VPN', icon: '🔒' },
        { key: 'is_tor', label: 'TOR NODE', icon: '🧅', danger: true },
        { key: 'is_abuser', label: 'ABUSIVE', icon: '🚫', danger: true },
        { key: 'is_mobile', label: 'MOBILE', icon: '📱' },
        { key: 'is_bogon', label: 'BOGON', icon: '👻' },
        { key: 'is_crawler', label: 'BOT', icon: '🤖' }
    ];

    const tagsHtml = flags.map(item => {
        const isActive = d[item.key] === true;
        const className = isActive ? (item.danger ? 'active danger' : 'active') : '';
        return `<div class="tag ${className}">${item.icon} ${item.label}</div>`;
    }).join('');

    const asn = d.asn?.asn ? `AS${d.asn.asn}` : '-';
    const org = d.company?.name || d.asn?.org || '-';
    const localTime = d.location?.local_time ? d.location.local_time.split('T')[1].split('.')[0] : '-';
    const score = d.company?.abuser_score || "0";
    
    panel.innerHTML = `
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <span class="brand-text">NET SIGHT</span>
            </div>
            <div class="live-indicator">
                <div class="blink"></div>
                LIVE DATA
            </div>
        </div>

        <!-- Hero -->
        <div class="hero-section">
            <div class="ip-overview">
                <div class="flag-large">${flag}</div>
                <div class="ip-display">${d.ip}</div>
                <div class="location-text">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    ${d.location?.city || 'Unknown City'}, ${d.location?.country || 'Unknown Country'}
                </div>
            </div>
            <div class="map-box">
                <iframe class="map-frame" src="${mapUrl}"></iframe>
                <div class="map-overlay">${lat.toFixed(4)}, ${lon.toFixed(4)}</div>
            </div>
        </div>

        <!-- Tags -->
        <div style="padding: 30px 40px 10px; font-size:12px; color:var(--text-secondary); font-weight:700;">IDENTITY SIGNATURES</div>
        <div class="tags-container">
            ${tagsHtml}
        </div>

        <!-- Info Grid -->
        <div class="grid-layout">
            <!-- Network -->
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                    INFRASTRUCTURE
                </div>
                <div class="info-item"><span class="label">ASN</span><span class="val highlight">${asn}</span></div>
                <div class="info-item"><span class="label">ISP</span><span class="val">${org}</span></div>
                <div class="info-item"><span class="label">Route</span><span class="val">${d.asn?.route || '-'}</span></div>
                <div class="info-item"><span class="label">Type</span><span class="val">${d.company?.type || '-'}</span></div>
            </div>

            <!-- Regional -->
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    REGIONAL
                </div>
                <div class="info-item"><span class="label">Timezone</span><span class="val">${d.location?.timezone || '-'}</span></div>
                <div class="info-item"><span class="label">Local Time</span><span class="val">${localTime}</span></div>
                <div class="info-item"><span class="label">ZIP Code</span><span class="val">${d.location?.zip || '-'}</span></div>
                <div class="info-item"><span class="label">Continent</span><span class="val">${d.location?.continent || '-'}</span></div>
            </div>

            <!-- WHOIS INTELLIGENCE (NEW) -->
            <div class="card" style="border-color: rgba(6, 182, 212, 0.4);">
                <div class="card-header" style="color:#fff;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 12l-4-4v3H2v2h8v3m12-4a10 10 0 01-19.54 3h2.13a8 8 0 100-6H2.46A10 10 0 0122 12z"/></svg>
                    WHOIS INTELLIGENCE
                </div>
                <div class="info-item"><span class="label">Netname</span><span class="val highlight mono">${whois.netname}</span></div>
                <div class="info-item"><span class="label">Range</span><span class="val mono">${whois.inetnum}</span></div>
                <div class="info-item"><span class="label">Descr</span><span class="val">${whois.descr.substring(0,25)}</span></div>
                <div class="info-item"><span class="label">Abuse Email</span><span class="val" style="color:var(--danger-color)">${whois.abuse}</span></div>
            </div>

            <!-- Security -->
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                    RISK ANALYSIS
                </div>
                <div class="info-item">
                    <span class="label">Abuse Score</span>
                    <span class="val" style="color: ${parseInt(score) > 0 ? 'var(--danger-color)' : 'var(--success-color)'}">${score}/100</span>
                </div>
                <div class="info-item"><span class="label">Bogon</span><span class="val">${d.is_bogon ? 'Yes' : 'No'}</span></div>
                <div class="info-item"><span class="label">Tor Exit</span><span class="val">${d.is_tor ? 'Yes' : 'No'}</span></div>
                <div class="info-item"><span class="label">Crawler</span><span class="val">${d.is_crawler ? 'Yes' : 'No'}</span></div>
            </div>
        </div>

        <!-- Raw Terminal -->
        <div class="terminal-section">
            <div class="terminal-header">
                <span>> RAW WHOIS DATA</span>
                <span style="opacity:0.5">SOURCE: ${d.rir || 'UNKNOWN'}</span>
            </div>
            <div class="terminal-box">${whoisText}</div>
        </div>
        
        <div style="text-align:center; padding-bottom: 20px; color: var(--text-secondary); font-size: 10px; opacity: 0.5;">
            DATA SOURCE: IPAPI.IS • LATENCY: ${d.elapsed_ms || 0}MS
        </div>
    `;
}

function getFlag(code) {
    if(!code) return '🌐';
    try {
        return String.fromCodePoint(...code.toUpperCase().split('').map(c => 127397 + c.charCodeAt()));
    } catch(e) { return '🌐'; }
}

loadIP();
</script>
</body>
</html>
