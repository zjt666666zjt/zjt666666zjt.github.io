<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全维 IP 情报面板</title>
<style>
    :root {
        --bg-color: #0f172a;
        --panel-bg: rgba(30, 41, 59, 0.7);
        --border-color: rgba(148, 163, 184, 0.1);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-color: #38bdf8;
        --success-color: #4ade80;
        --warning-color: #fbbf24;
        --danger-color: #f87171;
        --badge-bg-inactive: rgba(148, 163, 184, 0.1);
        --badge-text-inactive: #64748b;
    }

    body {
        background-color: var(--bg-color);
        background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                          radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
        background-attachment: fixed;
        color: var(--text-primary);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .container {
        width: 100%;
        max-width: 800px;
        animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .panel {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        overflow: hidden;
    }

    /* 头部区域 */
    .header {
        padding: 40px;
        text-align: center;
        border-bottom: 1px solid var(--border-color);
        position: relative;
    }

    .flag-icon {
        font-size: 64px;
        display: block;
        margin-bottom: 16px;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .ip-address {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
        font-family: 'Monaco', 'Consolas', monospace;
    }

    .location-summary {
        color: var(--text-secondary);
        font-size: 16px;
        margin-top: 10px;
        font-weight: 500;
    }

    /* 状态徽章网格 */
    .badges-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 24px;
    }

    .badge {
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
        border: 1px solid transparent;
    }

    .badge.active {
        background: rgba(56, 189, 248, 0.15);
        color: var(--accent-color);
        border-color: rgba(56, 189, 248, 0.3);
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
    }
    
    .badge.danger {
        background: rgba(248, 113, 113, 0.15);
        color: var(--danger-color);
        border-color: rgba(248, 113, 113, 0.3);
        box-shadow: 0 0 15px rgba(248, 113, 113, 0.2);
    }
    
    .badge.inactive {
        background: var(--badge-bg-inactive);
        color: var(--badge-text-inactive);
        opacity: 0.6;
    }

    /* 内容区域 */
    .content-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1px; /* 用于分割线效果 */
        background: var(--border-color); /* 网格线颜色 */
    }

    .section {
        background: rgba(30, 41, 59, 0.4); /* 恢复背景色 */
        padding: 30px;
    }

    .section-header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        color: var(--text-primary);
        font-weight: 700;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .section-header svg {
        margin-right: 10px;
        width: 18px;
        height: 18px;
        color: var(--accent-color);
    }

    .info-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.6;
    }

    .info-label {
        color: var(--text-secondary);
        flex-shrink: 0;
        margin-right: 15px;
    }

    .info-value {
        color: var(--text-primary);
        font-weight: 500;
        text-align: right;
        word-break: break-word;
    }
    
    .info-value a {
        color: var(--accent-color);
        text-decoration: none;
        border-bottom: 1px dashed var(--accent-color);
    }

    .score-bar {
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
        margin-top: 6px;
        overflow: hidden;
    }
    .score-fill {
        height: 100%;
        background: var(--success-color);
        width: 0%;
        transition: width 1s ease, background-color 0.3s;
    }

    .loading-container {
        text-align: center;
        padding: 60px;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.1);
        border-left-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

</style>
</head>
<body>

<div class="container">
    <div class="panel" id="panel">
        <div class="loading-container">
            <div class="spinner"></div>
            <div style="color: var(--text-secondary)">正在深度扫描 IP 数据...</div>
        </div>
    </div>
</div>

<script>
async function loadIP() {
    const panel = document.getElementById('panel');
    const API_KEY = "bc457a7850f88f5d0423";

    try {
        const res = await fetch(`https://api.ipapi.is/?key=${API_KEY}`);
        const d = await res.json();

        if (d.error) {
            panel.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger-color)">❌ API 错误: ${d.error.message || JSON.stringify(d.error)}</div>`;
            return;
        }

        renderDashboard(d);

    } catch (e) {
        console.error(e);
        panel.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger-color)">❌ 网络请求失败，请检查连接</div>`;
    }
}

function renderDashboard(d) {
    const panel = document.getElementById('panel');
    const flag = getFlag(d.location?.country_code);
    
    // 提取布尔状态
    const flags = [
        { key: 'is_mobile', label: '移动网络', icon: '📱' },
        { key: 'is_datacenter', label: '数据中心', icon: '🏢' },
        { key: 'is_proxy', label: '代理(Proxy)', icon: '🛡️' },
        { key: 'is_vpn', label: 'VPN', icon: '🔒' },
        { key: 'is_tor', label: 'Tor节点', icon: '🧅', danger: true },
        { key: 'is_abuser', label: '滥用IP', icon: '🚫', danger: true },
        { key: 'is_bogon', label: '保留地址', icon: '👻' },
        { key: 'is_satellite', label: '卫星网络', icon: '🛰️' },
        { key: 'is_crawler', label: '爬虫', icon: '🕷️' }
    ];

    // 生成 Badge HTML
    const badgesHtml = flags.map(item => {
        const isActive = d[item.key] === true;
        const className = isActive ? (item.danger ? 'active danger' : 'active') : 'inactive';
        return `<div class="badge ${className}">${item.icon} ${item.label}</div>`;
    }).join('');

    // 处理数据中心显示
    const dcInfo = d.datacenter ? d.datacenter.datacenter : '非数据中心';
    const networkRange = d.datacenter ? d.datacenter.network : (d.company?.network || '-');

    // 处理 Abuse 分数颜色
    const abuserScore = d.company?.abuser_score || "0";
    const scoreVal = parseInt(abuserScore);
    let scoreColor = 'var(--success-color)';
    if (scoreVal > 20) scoreColor = 'var(--warning-color)';
    if (scoreVal > 50) scoreColor = 'var(--danger-color)';

    // 格式化时间
    const localTime = d.location?.local_time ? d.location.local_time.replace('T', ' ').split('+')[0] : '-';
    const timeUnix = d.location?.local_time_unix || '-';
    
    // Google Maps 链接
    const mapLink = d.location?.latitude ? 
        `<a href="https://www.google.com/maps/search/?api=1&query=${d.location.latitude},${d.location.longitude}" target="_blank">${d.location.latitude}, ${d.location.longitude} ↗</a>` : '-';

    panel.innerHTML = `
        <div class="header">
            <span class="flag-icon">${flag}</span>
            <div class="ip-address">${d.ip}</div>
            <div class="location-summary">${d.location?.city || ''}, ${d.location?.state || ''}, ${d.location?.country || ''}</div>
            <div class="badges-grid">${badgesHtml}</div>
        </div>

        <div class="content-grid">
            <!-- 地理位置 -->
            <div class="section">
                <div class="section-header">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    地理定位 (Location)
                </div>
                <div class="info-row"><span class="info-label">大洲</span><span class="info-value">${d.location?.continent || '-'}</span></div>
                <div class="info-row"><span class="info-label">国家代码</span><span class="info-value">${d.location?.country_code || '-'} (${d.location?.calling_code ? '+' + d.location.calling_code : '-'})</span></div>
                <div class="info-row"><span class="info-label">邮编</span><span class="info-value">${d.location?.zip || '-'}</span></div>
                <div class="info-row"><span class="info-label">坐标</span><span class="info-value">${mapLink}</span></div>
                <div class="info-row"><span class="info-label">欧盟成员</span><span class="info-value">${d.location?.is_eu_member ? '是' : '否'}</span></div>
                <div class="info-row"><span class="info-label">货币</span><span class="info-value">${d.location?.currency_code || '-'}</span></div>
            </div>

            <!-- 时间信息 -->
            <div class="section">
                <div class="section-header">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    时区信息 (Time)
                </div>
                <div class="info-row"><span class="info-label">时区</span><span class="info-value">${d.location?.timezone || '-'}</span></div>
                <div class="info-row"><span class="info-label">本地时间</span><span class="info-value">${localTime}</span></div>
                <div class="info-row"><span class="info-label">Unix 时间戳</span><span class="info-value">${timeUnix}</span></div>
                <div class="info-row"><span class="info-label">夏令时 (DST)</span><span class="info-value">${d.location?.is_dst ? '启用' : '未启用'}</span></div>
            </div>

            <!-- 网络信息 -->
            <div class="section">
                <div class="section-header">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    网络设施 (Network)
                </div>
                <div class="info-row"><span class="info-label">RIR 机构</span><span class="info-value">${d.rir || '-'}</span></div>
                <div class="info-row"><span class="info-label">ASN</span><span class="info-value">AS${d.asn?.asn || '-'}</span></div>
                <div class="info-row"><span class="info-label">网络段</span><span class="info-value">${networkRange}</span></div>
                <div class="info-row"><span class="info-label">数据中心</span><span class="info-value">${dcInfo}</span></div>
                <div class="info-row"><span class="info-label">路由描述</span><span class="info-value">${d.asn?.route || '-'}</span></div>
            </div>

            <!-- 公司与安全 -->
            <div class="section">
                <div class="section-header">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    归属与安全 (Owner)
                </div>
                <div class="info-row"><span class="info-label">拥有者</span><span class="info-value">${d.company?.name || '-'}</span></div>
                <div class="info-row"><span class="info-label">域名</span><span class="info-value">${d.company?.domain || '-'}</span></div>
                <div class="info-row"><span class="info-label">类型</span><span class="info-value">${d.company?.type || '-'}</span></div>
                <div class="info-row" style="flex-direction:column; align-items:flex-start">
                    <div style="display:flex;justify-content:space-between;width:100%">
                        <span class="info-label">信誉评分</span>
                        <span class="info-value" style="color:${scoreColor}">${abuserScore}</span>
                    </div>
                    <div class="score-bar" style="width:100%">
                        <div class="score-fill" style="width: ${Math.min(scoreVal, 100)}%; background-color:${scoreColor}"></div>
                    </div>
                </div>
                <div class="info-row"><span class="info-label">Whois</span><span class="info-value"><a href="${d.company?.whois || '#'}" target="_blank">查询 ↗</a></span></div>
            </div>

            <!-- 滥用联系 -->
            <div class="section" style="grid-column: 1 / -1;">
                <div class="section-header">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    Abuse 联系方式
                </div>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div class="info-row"><span class="info-label">机构</span><span class="info-value">${d.abuse?.name || '-'}</span></div>
                    <div class="info-row"><span class="info-label">邮箱</span><span class="info-value">${d.abuse?.email || '-'}</span></div>
                    <div class="info-row"><span class="info-label">电话</span><span class="info-value">${d.abuse?.phone || '-'}</span></div>
                    <div class="info-row"><span class="info-label">地址</span><span class="info-value">${d.abuse?.address || '-'}</span></div>
                </div>
            </div>
        </div>

        <div style="padding: 10px; text-align: right; color: var(--text-secondary); font-size: 11px; border-top:1px solid var(--border-color)">
            查询耗时: ${d.elapsed_ms || 0}ms
        </div>
    `;
}

function getFlag(code) {
    if(!code) return '🌐';
    try {
        return String.fromCodePoint(...code.toUpperCase().split('').map(c => 127397 + c.charCodeAt()));
    } catch(e) { return '🌐'; }
}

loadIP();
</script>
</body>
</html>
