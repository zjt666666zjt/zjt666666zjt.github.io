<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NET SIGHT - 全维 IP 情报</title>
<style>
    :root {
        --bg-color: #020617;
        --panel-bg: rgba(15, 23, 42, 0.75); /*稍微加深背景以提高可读性*/
        --panel-border: rgba(56, 189, 248, 0.2);
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --accent-color: #06b6d4; /* Cyan */
        --accent-glow: rgba(6, 182, 212, 0.3);
        --success-color: #10b981;
        --warning-color: #f59e0b;
        --danger-color: #ef4444;
        --terminal-bg: #0c0c0c;
        --terminal-text: #4af626;
        --map-height: 320px;
    }

    body {
        background-color: var(--bg-color);
        background-image: 
            radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 25%),
            radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.08), transparent 25%);
        color: var(--text-primary);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .container {
        width: 100%;
        max-width: 1200px; /* 进一步加宽以容纳更多详细信息 */
        animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .panel {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 
                    0 20px 50px -10px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        position: relative;
    }

    /* 顶部光效线条 */
    .panel::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        opacity: 0.5;
    }

    /* --- Header Area --- */
    .header {
        padding: 25px 40px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        background: rgba(0,0,0,0.2);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .logo-icon {
        width: 28px;
        height: 28px;
        color: var(--accent-color);
        filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .brand-text {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .live-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--accent-color);
        background: rgba(6, 182, 212, 0.1);
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .blink {
        width: 6px;
        height: 6px;
        background: var(--accent-color);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-color);
        animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* --- Hero Section (Map + Core IP) --- */
    .hero-section {
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    @media (max-width: 900px) {
        .hero-section { grid-template-columns: 1fr; }
    }

    .ip-overview {
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .flag-large {
        font-size: 56px;
        margin-bottom: 10px;
        display: inline-block;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .ip-display {
        font-family: 'Monaco', monospace;
        font-size: 42px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 8px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        letter-spacing: -1px;
    }

    .location-text {
        font-size: 18px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
    }

    /* 地图容器 */
    .map-box {
        height: var(--map-height);
        background: #0f172a;
        position: relative;
        overflow: hidden;
        border-left: 1px solid rgba(255,255,255,0.05);
    }
    
    @media (max-width: 900px) {
        .map-box { border-left: none; border-top: 1px solid rgba(255,255,255,0.05); height: 250px; }
    }

    .map-frame {
        width: 100%;
        height: 100%;
        border: none;
        filter: grayscale(100%) invert(90%) contrast(85%); 
        opacity: 0.8;
        transition: opacity 0.3s;
    }
    .map-frame:hover { opacity: 1; filter: grayscale(0%) invert(0%); }

    .map-overlay {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background: rgba(0,0,0,0.8);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
        color: #fff;
        backdrop-filter: blur(4px);
    }

    /* Tags - Expanded */
    .tags-container {
        padding: 20px 40px 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-secondary);
        text-transform: uppercase;
        transition: all 0.3s;
    }

    .tag.active {
        background: rgba(6, 182, 212, 0.1);
        border-color: rgba(6, 182, 212, 0.3);
        color: var(--accent-color);
        box-shadow: 0 0 10px rgba(6, 182, 212, 0.1);
    }

    .tag.danger {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.4);
        color: var(--danger-color);
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
    }

    /* --- Content Grid --- */
    .grid-layout {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
        padding: 30px 40px;
    }

    .card {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 16px;
        padding: 20px;
        transition: transform 0.2s, background 0.2s;
        display: flex;
        flex-direction: column;
    }

    .card:hover {
        background: rgba(255,255,255,0.04);
        transform: translateY(-2px);
    }

    .card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        color: var(--accent-color);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .info-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 13px;
        line-height: 1.5;
    }
    
    .info-item.block {
        flex-direction: column;
        gap: 2px;
    }
    .info-item.block .val { text-align: left; max-width: 100%; }

    .label { color: var(--text-secondary); font-size: 12px; }
    .val { color: var(--text-primary); font-weight: 500; text-align: right; word-break: break-all; max-width: 65%; font-size: 13px;}
    .val.highlight { color: var(--accent-color); }
    .val.mono { font-family: 'Monaco', 'Consolas', monospace; font-size: 12px; letter-spacing: -0.5px; }
    .val.link { color: var(--accent-color); text-decoration: underline; cursor: pointer; }

    /* Score Bar */
    .score-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 5px; overflow: hidden;}
    .score-fill { height: 100%; transition: width 0.5s ease; }

    /* Terminal Section */
    .terminal-section {
        margin: 0 40px 40px 40px;
        border-top: 1px solid rgba(255,255,255,0.05);
        padding-top: 30px;
    }
    
    .terminal-header {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Monaco', monospace;
    }

    .terminal-box {
        background: var(--terminal-bg);
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        font-family: 'Monaco', 'Consolas', monospace;
        font-size: 11px;
        line-height: 1.6;
        color: var(--terminal-text);
        max-height: 500px;
        overflow-y: auto;
        white-space: pre-wrap;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    }

    /* Loading */
    .loading-view {
        padding: 100px;
        text-align: center;
        color: var(--text-secondary);
    }
    .loader {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255,255,255,0.1);
        border-radius: 50%;
        border-top-color: var(--accent-color);
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

</style>
</head>
<body>

<div class="container">
    <div class="panel" id="panel">
        <div class="loading-view">
            <div class="loader"></div>
            <div>INITIALIZING GLOBAL NETWORK SCAN...</div>
        </div>
    </div>
</div>

<script>
async function loadIP() {
    const panel = document.getElementById('panel');
    const API_KEY = "bc457a7850f88f5d0423";

    try {
        // 1. 获取主 JSON 数据
        const mainReq = fetch(`https://api.ipapi.is/?key=${API_KEY}`);
        const mainRes = await mainReq;
        const d = await mainRes.json();

        if (d.error) {
            panel.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger-color)">❌ SYSTEM ERROR: ${d.error.message || JSON.stringify(d.error)}</div>`;
            return;
        }

        // 2. 获取 Whois 文本数据
        let whoisText = "";
        try {
            const whoisRes = await fetch(`https://api.ipapi.is/?whois=${d.ip}&key=${API_KEY}`);
            if (whoisRes.ok) {
                whoisText = await whoisRes.text();
            } else {
                whoisText = `Failed to fetch Whois data: ${whoisRes.status}`;
            }
        } catch (err) {
            whoisText = `Whois connection error: ${err.message}`;
        }

        renderDashboard(d, whoisText);

    } catch (e) {
        console.error(e);
        panel.innerHTML = `<div style="padding:40px;text-align:center;color:var(--danger-color)">❌ CONNECTION FAILED</div>`;
    }
}

function parseWhois(text) {
    if (!text) return {};
    const extract = (regex) => {
        const match = text.match(regex);
        return match ? match[1].trim() : null;
    };
    return {
        netname: extract(/netname:\s*(.+)/i) || extract(/Network Name:\s*(.+)/i),
        descr: extract(/descr:\s*(.+)/i),
        country: extract(/country:\s*(.+)/i),
        inetnum: extract(/(?:inetnum|NetRange):\s*(.+)/i),
        abuse: extract(/(?:abuse-mailbox|OrgAbuseEmail|e-mail):\s*(.+)/i),
        maintainedBy: extract(/mnt-by:\s*(.+)/i),
        lastModified: extract(/(?:last-modified|Updated):\s*(.+)/i),
        source: extract(/source:\s*(.+)/i)
    };
}

function renderDashboard(d, whoisText) {
    const panel = document.getElementById('panel');
    const flag = getFlag(d.location?.country_code);
    const whois = parseWhois(whoisText);

    // 经纬度
    const lat = d.location?.latitude || 0;
    const lon = d.location?.longitude || 0;
    const mapUrl = `https://maps.google.com/maps?q=${lat},${lon}&z=10&output=embed&iwloc=near`;

    // 状态标签定义 (全部布尔值)
    const flags = [
        { key: 'is_datacenter', label: 'DATACENTER', icon: '🏢' },
        { key: 'is_proxy', label: 'PROXY', icon: '🛡️' },
        { key: 'is_vpn', label: 'VPN', icon: '🔒' },
        { key: 'is_tor', label: 'TOR NODE', icon: '🧅', danger: true },
        { key: 'is_abuser', label: 'ABUSIVE', icon: '🚫', danger: true },
        { key: 'is_mobile', label: 'MOBILE', icon: '📱' },
        { key: 'is_satellite', label: 'SATELLITE', icon: '🛰️' },
        { key: 'is_bogon', label: 'BOGON', icon: '👻' },
        { key: 'is_crawler', label: 'CRAWLER', icon: '🤖' },
        { key: 'is_eu_member', label: 'EU MEMBER', icon: '🇪🇺' }
    ];

    const tagsHtml = flags.map(item => {
        const isActive = d[item.key] === true;
        const className = isActive ? (item.danger ? 'active danger' : 'active') : '';
        return `<div class="tag ${className}">${item.icon} ${item.label}</div>`;
    }).join('');

    // 数据处理
    const asn = d.asn?.asn ? `AS${d.asn.asn}` : '-';
    const org = d.company?.name || d.asn?.org || '-';
    const localTime = d.location?.local_time ? d.location.local_time.replace('T', ' ').split('+')[0] : '-';
    const score = d.company?.abuser_score || "0";
    const scoreVal = parseInt(score);
    let scoreColor = scoreVal > 0 ? 'var(--danger-color)' : 'var(--success-color)';

    // Datacenter Info
    const dcName = d.datacenter ? d.datacenter.datacenter : null;
    const dcNet = d.datacenter ? d.datacenter.network : null;

    panel.innerHTML = `
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <span class="brand-text">NET SIGHT</span>
            </div>
            <div class="live-indicator">
                <div class="blink"></div>
                LIVE
            </div>
        </div>

        <!-- Hero: Map & IP -->
        <div class="hero-section">
            <div class="ip-overview">
                <div class="flag-large">${flag}</div>
                <div class="ip-display">${d.ip}</div>
                <div class="location-text">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    ${d.location?.city || '-'}, ${d.location?.state || '-'}, ${d.location?.country || '-'}
                </div>
                <!-- Identity Tags -->
                <div class="tags-container" style="padding:0;">
                    ${tagsHtml}
                </div>
            </div>
            <div class="map-box">
                <iframe class="map-frame" src="${mapUrl}"></iframe>
                <div class="map-overlay">${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="grid-layout">
            
            <!-- Network Infrastructure -->
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                    NETWORK INFRASTRUCTURE
                </div>
                <div class="info-item"><span class="label">ASN</span><span class="val highlight">${asn}</span></div>
                <div class="info-item"><span class="label">Organization</span><span class="val">${org}</span></div>
                <div class="info-item"><span class="label">RIR</span><span class="val">${d.rir || '-'}</span></div>
                <div class="info-item"><span class="label">Route</span><span class="val mono">${d.asn?.route || '-'}</span></div>
                <div class="info-item"><span class="label">Company Type</span><span class="val">${d.company?.type || '-'}</span></div>
                <div class="info-item"><span class="label">Domain</span><span class="val link" onclick="window.open('http://${d.company?.domain || ''}')">${d.company?.domain || '-'}</span></div>
                ${dcName ? `<div style="margin-top:10px; padding-top:10px; border-top:1px dashed rgba(255,255,255,0.1)"></div>` : ''}
                ${dcName ? `<div class="info-item block"><span class="label">Datacenter</span><span class="val highlight">${dcName}</span></div>` : ''}
                ${dcNet ? `<div class="info-item"><span class="label">DC Network</span><span class="val mono">${dcNet}</span></div>` : ''}
            </div>

            <!-- Extended Location -->
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    GEO DETAILS
                </div>
                <div class="info-item"><span class="label">Continent</span><span class="val">${d.location?.continent || '-'} (${d.location?.country_code || '-'})</span></div>
                <div class="info-item"><span class="label">Calling Code</span><span class="val">+${d.location?.calling_code || '-'}</span></div>
                <div class="info-item"><span class="label">Currency</span><span class="val">${d.location?.currency_code || '-'}</span></div>
                <div class="info-item"><span class="label">Timezone</span><span class="val">${d.location?.timezone || '-'}</span></div>
                <div class="info-item"><span class="label">Local Time</span><span class="val">${localTime}</span></div>
                <div class="info-item"><span class="label">Unix Time</span><span class="val mono">${d.location?.local_time_unix || '-'}</span></div>
                <div class="info-item"><span class="label">DST</span><span class="val">${d.location?.is_dst ? 'Active' : 'Inactive'}</span></div>
                <div class="info-item"><span class="label">Zip Code</span><span class="val">${d.location?.zip || '-'}</span></div>
            </div>

            <!-- Security & Abuse -->
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                    SECURITY PROFILE
                </div>
                <div class="info-item">
                    <span class="label">Abuse Score</span>
                    <span class="val" style="color: ${scoreColor}">${score} (Low)</span>
                </div>
                <div class="score-container">
                    <div class="score-fill" style="width: ${Math.min(parseInt(score), 100)}%; background-color: ${scoreColor}"></div>
                </div>
                <div style="margin-top:15px"></div>
                <div class="info-item"><span class="label">Is Bogon</span><span class="val">${d.is_bogon ? 'Yes' : 'No'}</span></div>
                <div class="info-item"><span class="label">Is Tor</span><span class="val">${d.is_tor ? 'Yes' : 'No'}</span></div>
                <div class="info-item"><span class="label">Is Proxy</span><span class="val">${d.is_proxy ? 'Yes' : 'No'}</span></div>
                <div class="info-item"><span class="label">Is Crawler</span><span class="val">${d.is_crawler ? 'Yes' : 'No'}</span></div>
                <div class="info-item"><span class="label">Is Abuser</span><span class="val" style="color:${d.is_abuser ? 'var(--danger-color)' : 'inherit'}">${d.is_abuser ? 'YES' : 'No'}</span></div>
            </div>

            <!-- Abuse Contact Info (New) -->
            <div class="card">
                <div class="card-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    ABUSE CONTACT
                </div>
                <div class="info-item block">
                    <span class="label">Name</span>
                    <span class="val">${d.abuse?.name || '-'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Email</span>
                    <span class="val link" style="color:var(--danger-color)">${d.abuse?.email || '-'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Phone</span>
                    <span class="val">${d.abuse?.phone || '-'}</span>
                </div>
                <div class="info-item block">
                    <span class="label">Address</span>
                    <span class="val" style="font-size:12px; opacity:0.8">${d.abuse?.address || '-'}</span>
                </div>
            </div>

            <!-- Whois Summary -->
            <div class="card" style="border-color: rgba(6, 182, 212, 0.4); grid-column: 1 / -1;">
                <div class="card-header" style="color:#fff;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 12l-4-4v3H2v2h8v3m12-4a10 10 0 01-19.54 3h2.13a8 8 0 100-6H2.46A10 10 0 0122 12z"/></svg>
                    WHOIS INTELLIGENCE SUMMARY
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                    <div class="info-item block"><span class="label">Netname</span><span class="val highlight mono">${whois.netname || '-'}</span></div>
                    <div class="info-item block"><span class="label">Net Range</span><span class="val mono">${whois.inetnum || '-'}</span></div>
                    <div class="info-item block"><span class="label">Description</span><span class="val">${whois.descr ? whois.descr.substring(0, 40) : '-'}</span></div>
                    <div class="info-item block"><span class="label">Last Modified</span><span class="val mono">${whois.lastModified || '-'}</span></div>
                    <div class="info-item block"><span class="label">Maintainer</span><span class="val mono">${whois.maintainedBy || '-'}</span></div>
                    <div class="info-item block"><span class="label">Source</span><span class="val mono">${whois.source || '-'}</span></div>
                </div>
            </div>

        </div>

        <!-- Raw Terminal -->
        <div class="terminal-section">
            <div class="terminal-header">
                <span>> RAW WHOIS DATA STREAM</span>
                <span style="opacity:0.5; font-size:10px;">LATENCY: ${d.elapsed_ms || 0}ms</span>
            </div>
            <div class="terminal-box">${whoisText}</div>
        </div>
        
        <div style="text-align:center; padding-bottom: 20px; color: var(--text-secondary); font-size: 10px; opacity: 0.4;">
            GENERATED BY NET SIGHT • DATA SOURCE: IPAPI.IS
        </div>
    `;
}

function getFlag(code) {
    if(!code) return '🌐';
    try {
        return String.fromCodePoint(...code.toUpperCase().split('').map(c => 127397 + c.charCodeAt()));
    } catch(e) { return '🌐'; }
}

loadIP();
</script>
